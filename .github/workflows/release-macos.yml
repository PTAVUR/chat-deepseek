name: Release macOS

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || github.run_id }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  release:
    name: Build macos-arm64
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Check architecture
        run: test "$(uname -m)" = "arm64"
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm type
      - name: Lint
        run: pnpm lint
      - name: Build web UI
        env:
          NODE_ENV: production
        run: |
          pnpm exec rspack build -c rspack.config.ts
          node scripts/embed-ui.mjs
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build CLI
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: |
          set -euo pipefail
          mkdir -p dist/darwin-arm64
          go build -trimpath \
            -ldflags "-s -w -X github.com/elegantgx/chat-deepseek/internal/buildinfo.Version=${VERSION}" \
            -o dist/darwin-arm64/chat-deepseek ./cmd/chat-deepseek
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gui/requirements.txt pyinstaller==6.22.3
      - name: Build GUI
        run: |
          set -euo pipefail
          python -m PyInstaller --noconfirm --clean --onefile \
            --name chat-deepseek-gui \
            --paths gui \
            --add-data "${GITHUB_WORKSPACE}/gui/assets:assets" \
            --distpath dist-gui \
            --workpath build-gui \
            --specpath build-gui \
            gui/app.py
          ls -lh dist-gui/chat-deepseek-gui
      - name: Assemble macOS app
        run: |
          set -euo pipefail
          bundle_version=$(python -c "import json; print(json.load(open('package.json'))['version'].split('-', 1)[0])")
          app="$PWD/dist-gui/chat-deepseek-gui.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          install -m 0755 dist-gui/chat-deepseek-gui "$app/Contents/MacOS/chat-deepseek-gui"
          install -m 0755 dist/darwin-arm64/chat-deepseek "$app/Contents/MacOS/chat-deepseek"
          install -m 0644 gui/assets/whale.icns "$app/Contents/Resources/chat-deepseek-gui.icns"
          printf 'APPL????' > "$app/Contents/PkgInfo"
          python - "$bundle_version" "$app" <<'PY'
          import plistlib
          import pathlib
          import sys

          version, bundle = sys.argv[1], pathlib.Path(sys.argv[2])
          info = {
              "CFBundleDevelopmentRegion": "zh_CN",
              "CFBundleDisplayName": "chat-deepseek",
              "CFBundleExecutable": "chat-deepseek-gui",
              "CFBundleIconFile": "chat-deepseek-gui.icns",
              "CFBundleIdentifier": "com.elegantgx.chat-deepseek",
              "CFBundleInfoDictionaryVersion": "6.0",
              "CFBundleName": "chat-deepseek-gui",
              "CFBundlePackageType": "APPL",
              "CFBundleShortVersionString": version,
              "CFBundleVersion": version,
              "LSApplicationCategoryType": "public.app-category.utilities",
              "LSMinimumSystemVersion": "12.0",
              "NSHighResolutionCapable": True,
          }
          (bundle / "Contents" / "Info.plist").write_bytes(
              plistlib.dumps(info, fmt=plistlib.FMT_XML)
          )
          PY
          codesign --force --deep --sign - "$app"
          ls -lh "$app/Contents/MacOS/chat-deepseek-gui"
      - name: Package
        run: |
          set -euo pipefail
          archive="chat-deepseek-${VERSION}-macos-arm64.zip"
          rm -rf release "${archive}"
          mkdir -p release
          install -m 0755 dist/darwin-arm64/chat-deepseek release/chat-deepseek
          ditto "$PWD/dist-gui/chat-deepseek-gui.app" release/chat-deepseek-gui.app
          cat > release/chat-deepseek-gui <<'SH'
#!/bin/sh
exec "$(dirname "$0")/chat-deepseek-gui.app/Contents/MacOS/chat-deepseek-gui" "$@"
SH
          chmod 0755 release/chat-deepseek-gui
          cp -R src release/src
          cp README.md LICENSE THIRD_PARTY_NOTICES.md release/
          chmod 0644 release/README.md release/LICENSE release/THIRD_PARTY_NOTICES.md
          ./release/chat-deepseek version
          (cd release && zip -9 -r "../${archive}" .)
          ls -lh "${archive}"
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: chat-deepseek-*-macos-arm64.zip
          retention-days: 30
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" chat-deepseek-*.zip --clobber
          else
            gh release create "$tag" chat-deepseek-*.zip \
              --title "$tag" --generate-notes ||
              gh release upload "$tag" chat-deepseek-*.zip --clobber
          fi
