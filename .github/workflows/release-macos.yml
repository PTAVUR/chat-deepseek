name: Release macOS

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || github.run_id }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  release:
    name: Build macos-arm64
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Check architecture
        run: test "$(uname -m)" = "arm64"
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm type
      - name: Lint
        run: pnpm lint
      - name: Build web UI
        env:
          NODE_ENV: production
        run: |
          pnpm exec rspack build -c rspack.config.ts
          node scripts/embed-ui.mjs
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build CLI
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: |
          set -euo pipefail
          mkdir -p dist/darwin-arm64
          go build -trimpath \
            -ldflags "-s -w -X github.com/elegantgx/chat-deepseek/internal/buildinfo.Version=${VERSION}" \
            -o dist/darwin-arm64/chat-deepseek ./cmd/chat-deepseek
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gui/requirements.txt pyinstaller==6.22.3
      - name: Build GUI
        run: |
          set -euo pipefail
          python -m PyInstaller --noconfirm --clean --onefile \
            --name chat-deepseek-gui \
            --paths gui \
            --add-data "${GITHUB_WORKSPACE}/gui/assets:assets" \
            --distpath dist-gui \
            --workpath build-gui \
            --specpath build-gui \
            gui/app.py
          ls -lh dist-gui/chat-deepseek-gui
      - name: Package
        run: |
          set -euo pipefail
          archive="chat-deepseek-${VERSION}-macos-arm64.zip"
          rm -rf release "${archive}" "${archive}.sha256"
          mkdir -p release
          install -m 0755 dist/darwin-arm64/chat-deepseek release/chat-deepseek
          install -m 0755 dist-gui/chat-deepseek-gui release/chat-deepseek-gui
          cp -R src release/src
          cp README.md LICENSE THIRD_PARTY_NOTICES.md release/
          chmod 0644 release/README.md release/LICENSE release/THIRD_PARTY_NOTICES.md
          ./release/chat-deepseek version
          (cd release && zip -9 -r "../${archive}" .)
          shasum -a 256 "${archive}" > "${archive}.sha256"
          ls -lh "${archive}" "${archive}.sha256"
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: |
            chat-deepseek-*-macos-arm64.zip
            chat-deepseek-*-macos-arm64.zip.sha256
          retention-days: 30
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" chat-deepseek-*.zip chat-deepseek-*.sha256 --clobber
          else
            gh release create "$tag" chat-deepseek-*.zip chat-deepseek-*.sha256 \
              --title "$tag" --generate-notes ||
              gh release upload "$tag" chat-deepseek-*.zip chat-deepseek-*.sha256 --clobber
          fi
