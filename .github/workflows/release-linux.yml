name: Release Linux

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || github.run_id }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  release:
    name: Build linux-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm type
      - name: Lint
        run: pnpm lint
      - name: Build web UI
        env:
          NODE_ENV: production
        run: |
          pnpm exec rspack build -c rspack.config.ts
          node scripts/embed-ui.mjs
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build CLI
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist/linux-amd64
          GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X github.com/elegantgx/chat-deepseek/internal/buildinfo.Version=${VERSION}" \
            -o dist/linux-amd64/chat-deepseek ./cmd/chat-deepseek
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libdbus-1-3 libfontconfig1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1
      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gui/requirements.txt pyinstaller==6.22.3
      - name: Build GUI
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name chat-deepseek-gui \
            --paths gui \
            --add-data "${GITHUB_WORKSPACE}/gui/assets:assets" \
            --distpath dist-gui \
            --workpath build-gui \
            --specpath build-gui \
            gui/app.py
          ls -lh dist-gui/chat-deepseek-gui
      - name: Package
        run: |
          set -euo pipefail
          archive="chat-deepseek-${VERSION}-linux-amd64.zip"
          rm -rf release "${archive}"
          mkdir -p release
          install -m 0755 dist/linux-amd64/chat-deepseek release/chat-deepseek
          install -m 0755 dist-gui/chat-deepseek-gui release/chat-deepseek-gui
          cp -a src release/src
          cp README.md LICENSE THIRD_PARTY_NOTICES.md release/
          chmod 0644 release/README.md release/LICENSE release/THIRD_PARTY_NOTICES.md
          ./release/chat-deepseek version
          (cd release && zip -9 -r "../${archive}" .)
          ls -lh "${archive}"
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-amd64
          path: chat-deepseek-*-linux-amd64.zip
          retention-days: 30
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" chat-deepseek-*.zip --clobber
          else
            gh release create "$tag" chat-deepseek-*.zip \
              --title "$tag" --generate-notes ||
              gh release upload "$tag" chat-deepseek-*.zip --clobber
          fi
