name: Release Windows

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || github.run_id }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  release:
    name: Build windows-amd64
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm type
      - name: Lint
        run: pnpm lint
      - name: Build web UI
        env:
          NODE_ENV: production
        run: |
          pnpm exec rspack build -c rspack.config.ts
          node scripts/embed-ui.mjs
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build CLI
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist\windows-amd64 | Out-Null
          go build -trimpath -ldflags "-s -w -X github.com/elegantgx/chat-deepseek/internal/buildinfo.Version=$env:VERSION" -o dist\windows-amd64\chat-deepseek.exe ./cmd/chat-deepseek
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gui/requirements.txt pyinstaller==6.22.3
      - name: Build GUI
        run: |
          $ErrorActionPreference = "Stop"
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name chat-deepseek-gui `
            --paths gui `
            --icon "$env:GITHUB_WORKSPACE\gui\assets\whale.ico" `
            --add-data "$env:GITHUB_WORKSPACE\gui\assets;assets" `
            --distpath dist-gui `
            --workpath build-gui `
            --specpath build-gui `
            gui/app.py
          Get-Item dist-gui\chat-deepseek-gui.exe | Format-List Length,FullName
      - name: Package
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "chat-deepseek-$env:VERSION-windows-amd64.zip"
          Remove-Item -Recurse -Force release -ErrorAction SilentlyContinue
          Remove-Item -Force $archive -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/windows-amd64/chat-deepseek.exe release/chat-deepseek.exe
          Copy-Item dist-gui/chat-deepseek-gui.exe release/chat-deepseek-gui.exe
          New-Item -ItemType Directory -Force release/src | Out-Null
          Copy-Item -Path src\* -Destination release/src -Recurse
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md release/
          & .\release\chat-deepseek.exe version
          Compress-Archive -Path release\* -DestinationPath $archive -Force
          Get-Item $archive | Format-List Length,FullName
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-amd64
          path: chat-deepseek-*-windows-amd64.zip
          retention-days: 30
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:GITHUB_REF_NAME
          $archive = Get-ChildItem -Path . -File -Filter "chat-deepseek-*-windows-amd64.zip" | Select-Object -First 1
          if ($null -eq $archive) {
            throw "No release archive found"
          }
          # gh 把资产参数当作 glob；Windows 反斜杠会被当成转义符。
          $archivePath = $archive.FullName -replace '\\', '/'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $archivePath --clobber
          } else {
            gh release create $tag $archivePath --title $tag --generate-notes
            if ($LASTEXITCODE -ne 0) {
              gh release upload $tag $archivePath --clobber
            }
          }
