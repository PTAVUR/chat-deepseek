# 发布流水线只在 GitLab UI 手动 Run pipeline 时创建；push、MR、tag、schedule
# 都不会自动打包。手动运行后，各 job 按阶段自动执行。
#
# 平台说明：
# - Linux 使用默认共享 Runner。
# - Windows 使用 GitLab.com 的 saas-windows-medium-amd64（Beta，Free 起可用）。
# - macOS 使用 saas-macos-medium-m1（Beta，需要 Premium/Ultimate）；产物为 arm64。
# 如果使用自建 Runner，请把对应 job 的 tags 换成自己的 Runner 标签。
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - web
  - build
  - package

variables:
  GIT_DEPTH: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

build-web:
  stage: web
  image: node:22-bookworm
  before_script:
    - npm install --global pnpm@10
  script:
    - pnpm install --frozen-lockfile
    - pnpm build
  artifacts:
    paths:
      - internal/webui/dist/
    expire_in: 1 week

# Go 在 Linux 上交叉编译三个平台的 CLI；GUI 用 PyInstaller，必须在对应系统原生构建。
build-go:
  stage: build
  image: golang:1.27
  needs: ["build-web"]
  variables:
    CGO_ENABLED: "0"
  script:
    - |
      set -eu
      VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      build_target() {
        goos="$1"
        goarch="$2"
        output="$3"
        mkdir -p "$(dirname "$output")"
        GOOS="$goos" GOARCH="$goarch" go build -trimpath \
          -ldflags "-s -w -X gitlab.com/elegantgx/chat-deepseek/internal/buildinfo.Version=${VERSION}" \
          -o "$output" ./cmd/chat-deepseek
      }
      build_target linux amd64 dist/linux-amd64/chat-deepseek
      build_target windows amd64 dist/windows-amd64/chat-deepseek.exe
      build_target darwin arm64 dist/darwin-arm64/chat-deepseek
      ls -lh dist/*/chat-deepseek*
  artifacts:
    paths:
      - dist/linux-amd64/chat-deepseek
      - dist/windows-amd64/chat-deepseek.exe
      - dist/darwin-arm64/chat-deepseek
    expire_in: 1 week

build-gui-linux:
  stage: build
  image: python:3.13-bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
      libgl1 libegl1 libdbus-1-3 libfontconfig1 libxkbcommon-x11-0
      libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
      libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
    - python -m pip install -r gui/requirements.txt pyinstaller==6.22.3
  script:
    - |
      set -eu
      export QT_QPA_PLATFORM=offscreen
      pyinstaller --noconfirm --clean --onefile --windowed \
        --name chat-deepseek-gui \
        --paths gui \
        --add-data "$CI_PROJECT_DIR/gui/assets:assets" \
        --distpath dist-gui \
        --workpath build-gui \
        --specpath build-gui \
        gui/app.py
      ls -lh dist-gui/chat-deepseek-gui
  artifacts:
    paths:
      - dist-gui/chat-deepseek-gui
    expire_in: 1 week

build-gui-windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  before_script:
    - python --version
    - python -c "import sys; assert sys.version_info >= (3, 10), sys.version"
    - python -m venv .venv-release
    - .\.venv-release\Scripts\python.exe -m pip install --upgrade pip
    - .\.venv-release\Scripts\python.exe -m pip install -r gui\requirements.txt pyinstaller==6.22.3
  script:
    - |
      $ErrorActionPreference = "Stop"
      .\.venv-release\Scripts\python.exe -m PyInstaller --noconfirm --clean --onefile --windowed `
        --name chat-deepseek-gui `
        --paths gui `
        --add-data "$env:CI_PROJECT_DIR\gui\assets;assets" `
        --distpath dist-gui `
        --workpath build-gui `
        --specpath build-gui `
        gui/app.py
      Get-Item dist-gui\chat-deepseek-gui.exe | Format-List Length,FullName
  artifacts:
    paths:
      - dist-gui/chat-deepseek-gui.exe
    expire_in: 1 week

build-gui-macos:
  stage: build
  tags:
    - saas-macos-medium-m1
  image: macos-26-xcode-26
  before_script:
    - brew install python@3.13
    - export PATH="$(brew --prefix python@3.13)/bin:$PATH"
    - python3.13 --version
    - python3.13 -m venv .venv-release
    - .venv-release/bin/python -m pip install --upgrade pip
    - .venv-release/bin/python -m pip install -r gui/requirements.txt pyinstaller==6.22.3
  script:
    - |
      set -eu
      export QT_QPA_PLATFORM=offscreen
      # 保持单文件可执行，不生成 .app；发布包根目录仍然叫 chat-deepseek-gui。
      .venv-release/bin/python -m PyInstaller --noconfirm --clean --onefile \
        --name chat-deepseek-gui \
        --paths gui \
        --add-data "$CI_PROJECT_DIR/gui/assets:assets" \
        --distpath dist-gui \
        --workpath build-gui \
        --specpath build-gui \
        gui/app.py
      ls -lh dist-gui/chat-deepseek-gui
  artifacts:
    paths:
      - dist-gui/chat-deepseek-gui
    expire_in: 1 week

package-linux-amd64:
  stage: package
  image: debian:bookworm-slim
  needs: ["build-go", "build-gui-linux"]
  script:
    - |
      set -eu
      apt-get update
      apt-get install -y --no-install-recommends zip ca-certificates
      VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      ARCHIVE="chat-deepseek-${VERSION}-linux-amd64.zip"
      rm -rf release
      mkdir -p release
      install -m 0755 dist/linux-amd64/chat-deepseek release/chat-deepseek
      install -m 0755 dist-gui/chat-deepseek-gui release/chat-deepseek-gui
      cp -a src release/src
      cp README.md LICENSE THIRD_PARTY_NOTICES.md release/
      chmod 0644 release/README.md release/LICENSE release/THIRD_PARTY_NOTICES.md
      ./release/chat-deepseek version
      (cd release && zip -9 -r "../${ARCHIVE}" .)
      sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
      ls -lh "${ARCHIVE}" "${ARCHIVE}.sha256"
  artifacts:
    paths:
      - chat-deepseek-*-linux-amd64.zip
      - chat-deepseek-*-linux-amd64.zip.sha256
    expire_in: 1 month

package-windows-amd64:
  stage: package
  tags:
    - saas-windows-medium-amd64
  needs: ["build-go", "build-gui-windows"]
  script:
    - |
      $ErrorActionPreference = "Stop"
      $version = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { $env:CI_COMMIT_SHORT_SHA }
      $archive = "chat-deepseek-$version-windows-amd64.zip"
      Remove-Item -Recurse -Force release -ErrorAction SilentlyContinue
      New-Item -ItemType Directory -Force release | Out-Null
      Copy-Item dist/windows-amd64/chat-deepseek.exe release/chat-deepseek.exe
      Copy-Item dist-gui/chat-deepseek-gui.exe release/chat-deepseek-gui.exe
      New-Item -ItemType Directory -Force release/src | Out-Null
      Copy-Item -Path src\* -Destination release/src -Recurse
      Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md release/
      & .\release\chat-deepseek.exe version
      Compress-Archive -Path release\* -DestinationPath $archive -Force
      $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
      "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"
      Get-Item $archive, "$archive.sha256" | Format-List Length,FullName
  artifacts:
    paths:
      - chat-deepseek-*-windows-amd64.zip
      - chat-deepseek-*-windows-amd64.zip.sha256
    expire_in: 1 month

package-macos-arm64:
  stage: package
  tags:
    - saas-macos-medium-m1
  image: macos-26-xcode-26
  needs: ["build-go", "build-gui-macos"]
  script:
    - |
      set -eu
      VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      ARCHIVE="chat-deepseek-${VERSION}-macos-arm64.zip"
      rm -rf release "${ARCHIVE}" "${ARCHIVE}.sha256"
      mkdir -p release
      install -m 0755 dist/darwin-arm64/chat-deepseek release/chat-deepseek
      install -m 0755 dist-gui/chat-deepseek-gui release/chat-deepseek-gui
      cp -R src release/src
      cp README.md LICENSE THIRD_PARTY_NOTICES.md release/
      chmod 0644 release/README.md release/LICENSE release/THIRD_PARTY_NOTICES.md
      ./release/chat-deepseek version
      (cd release && zip -9 -r "../${ARCHIVE}" .)
      shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
      ls -lh "${ARCHIVE}" "${ARCHIVE}.sha256"
  artifacts:
    paths:
      - chat-deepseek-*-macos-arm64.zip
      - chat-deepseek-*-macos-arm64.zip.sha256
    expire_in: 1 month
